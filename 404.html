<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了 - LemCAE</title>
  <link rel="icon" href="/img/favicon.ico">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lemcae-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/home.css">
</head>
<body>
  <main class="page-shell" style="min-height:100vh;display:grid;place-items:center;">
    <section class="card" style="max-width:460px;width:100%;text-align:center;gap:14px;padding:34px 28px;">
      <div class="card-label" style="justify-content:center;">
        <span>ERROR 404</span>
      </div>
      <h1 style="margin:0;font-family:var(--font-mono);font-size:3rem;line-height:1.1;color:var(--accent);">404</h1>
      <p style="margin:0;color:var(--text-secondary);">这个页面似乎不存在，或者已经被搬走了。</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
        <a class="primary-btn" style="width:auto;padding:9px 20px;" href="/">回到首页</a>
        <a class="chip-link" href="/notes/">笔记专栏</a>
      </div>
    </section>
  </main>
</body>
</html>
