<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记 · LemCAE</title>
  <meta name="description" content="LemCAE 的轻量 Markdown 笔记专栏，收录历史笔记与后续新增记录。">
  <link rel="icon" href="/img/favicon.ico">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lemcae-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/home.css">
  <link rel="stylesheet" href="/assets/notes.css">
  <script src="/assets/home.js" defer></script>
  <script src="/assets/notes.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>lemcae.github.io / notes</span>
      </a>
      <div class="topbar-actions">
        <a class="icon-btn" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>返回首页</span>
        </a>
        <a class="icon-btn" href="/about/">
          <span>关于</span>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换深浅色主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <span id="theme-label">浅色模式</span>
        </button>
      </div>
    </header>

    <main class="bento-grid" id="notes-grid">
      <section class="card notes-hero span-4" aria-label="笔记说明">
        <div>
          <h1>笔记 &amp; 备忘录</h1>
          <p>保留了 2024 年写的几篇实用笔记，之后的新记录也会继续以纯 Markdown 的形式放在这里。</p>
        </div>
        <div class="filter-pills" id="note-filter-pills" role="group" aria-label="按分类筛选笔记"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2024–2026 LemCAE</span>
      <span>Markdown 驱动 · 零构建静态阅读</span>
    </footer>
  </div>
</body>
</html>
