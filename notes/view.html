<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读笔记 · LemCAE</title>
  <link rel="icon" href="/img/favicon.ico">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lemcae-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/home.css">
  <link rel="stylesheet" href="/assets/notes.css">
  <script src="/assets/home.js" defer></script>
  <script src="/assets/notes.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/notes/">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>lemcae.github.io / notes</span>
      </a>
      <div class="topbar-actions">
        <a class="icon-btn" href="/notes/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>全部笔记</span>
        </a>
        <a class="icon-btn" href="/">
          <span>首页</span>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换深浅色主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <span id="theme-label">浅色模式</span>
        </button>
      </div>
    </header>

    <main class="article-layout">
      <article class="card article-card">
        <header class="article-header">
          <div class="article-meta">
            <span class="tag-badge" id="article-category">笔记</span>
            <span class="project-year" id="article-date"></span>
          </div>
          <h1 id="article-title">加载中...</h1>
          <p class="article-summary" id="article-summary"></p>
        </header>

        <div class="md-body" id="article-body">正在加载笔记内容...</div>

        <nav class="article-nav" aria-label="文章底部导航">
          <a class="chip-link" href="/notes/">← 返回笔记列表</a>
          <a class="chip-link" href="/">回到 Bento 首页</a>
        </nav>
      </article>

      <aside class="card toc-card" id="toc-card" aria-label="文章目录">
        <div class="card-label">
          <span>CONTENTS</span>
          <span>目录</span>
        </div>
        <div class="toc-list" id="toc-list"></div>
      </aside>
    </main>

    <footer class="site-footer">
      <span>© 2024–2026 LemCAE</span>
      <span>Markdown 驱动 · 零构建静态阅读</span>
    </footer>
  </div>
</body>
</html>
