<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" role="img" aria-labelledby="title description">
  <title id="title">结构实验图纸</title>
  <desc id="description">力学图纸以铰接桁架为主图，两角附有悬臂梁和拱结构的草图。桁架上弦节点施有三个向下载荷，两端由铰支座和滚动支座承托。</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#bcd8ca" stroke-width="1" opacity=".8"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#aaccbb" stroke-width="1"/>
    </pattern>
    <marker id="load" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8 2 4Z" fill="#b9482e"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#e7f3ed"/>
  <rect x="20" y="20" width="620" height="320" rx="3" fill="url(#grid)" stroke="#abcbb9"/>
  <rect x="20" y="20" width="620" height="320" fill="url(#major-grid)" opacity=".65"/>
  <path d="M20 40V20h20m580 0h20v20m0 280v20h-20m-580 0H20v-20M322 20h16m-8-8v16M322 340h16m-8-8v16"
        fill="none" stroke="#719989" stroke-width="1.5"/>

  <g fill="none" stroke="#5d8a78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 48v52m0-48l-7 6m7 5l-7 6m7 5l-7 6m7 5l-7 6m7 5l-7 6M58 75h84"/>
    <path d="M58 75q53 1 84 25" stroke-dasharray="4 4"/>
    <path d="M505 100Q557 33 609 100m-110 0h12m92 0h12"/>
    <path d="M505 100h104" stroke-dasharray="4 4"/>
  </g>
  <path d="M142 53v17" fill="none" stroke="#b9482e" stroke-width="1.25" marker-end="url(#load)" opacity=".82"/>
  <path d="M557 52v14" fill="none" stroke="#b9482e" stroke-width="1.25" marker-end="url(#load)" opacity=".82"/>

  <g fill="none" stroke="#7caa94" stroke-width="1.3">
    <path d="M330 48v244" stroke-dasharray="5 6"/>
    <path d="M85 238v57m490-57v57M85 282h490m-485-5l-10 10m500-10l-10 10"/>
  </g>
  <rect x="318" y="271" width="24" height="20" rx="2" fill="#e7f3ed"/>
  <text x="330" y="287" text-anchor="middle" fill="#466e5e" font-family="monospace" font-size="15" font-style="italic">L</text>

  <g fill="none" stroke="#183d34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 220l81-90h328l81 90Z" fill="#c3e2d0" stroke-width="5"/>
    <path d="M166 130l82 90 82-90 82 90 82-90" stroke-width="4"/>
    <g stroke-width="2.1" fill="#e7f3ed">
      <path d="M85 220l-15 27h30ZM575 220l-15 20h30Z"/>
      <circle cx="568" cy="244" r="3.5"/>
      <circle cx="582" cy="244" r="3.5"/>
      <path d="M63 247h44m446 1h44" fill="none"/>
    </g>
    <path d="M69 247l-5 6m14-6l-5 6m14-6l-5 6m14-6l-5 6m14-6l-5 6m460-5l-5 6m14-6l-5 6m14-6l-5 6m14-6l-5 6m14-6l-5 6"
          stroke-width="1.4"/>
    <g fill="#e7f3ed" stroke-width="2.4">
      <circle cx="85" cy="220" r="5.5"/>
      <circle cx="166" cy="130" r="5.5"/>
      <circle cx="248" cy="220" r="5.5"/>
      <circle cx="330" cy="130" r="5.5"/>
      <circle cx="412" cy="220" r="5.5"/>
      <circle cx="494" cy="130" r="5.5"/>
      <circle cx="575" cy="220" r="5.5"/>
    </g>
  </g>
  <g fill="none" stroke="#b9482e" stroke-width="2.1" marker-end="url(#load)">
    <path d="M166 87v33"/>
    <path d="M330 72v48"/>
    <path d="M494 87v33"/>
  </g>
  <text x="342" y="83" fill="#a33b26" font-family="monospace" font-size="16" font-style="italic">F</text>

  <g fill="none" stroke="#698f81" stroke-linecap="round" stroke-width="1.4">
